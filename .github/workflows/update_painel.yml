name: Atualizar Painel Analytics (Nuvem)

on:
  schedule:
    # Roda a cada 15 min em minutos fora de pico (:07, :22, :37, :52) para evitar filas do GitHub
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas oficiais do Google
        run: pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Executar coleta nas 3 APIs do YouTube e gerar index.html
        env:
          CHANNELS_TOKENS_JSON: ${{ secrets.CHANNELS_TOKENS_JSON }}
          CHANNELS_TOKENS_BACKUP_JSON: ${{ secrets.CHANNELS_TOKENS_BACKUP_JSON }}
        run: python update_cloud.py

      - name: Salvar index.html e snapshots atualizados no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html analytics_realtime_snapshot.json analytics_history_30d.json last_good_cache.json
          git diff --staged --quiet || (
            git commit -m "Auto-update Painel Analytics ($(date -u +'%d/%m/%Y %H:%M UTC'))"
            git pull --rebase origin main || true
            git push origin main
          )
